<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3E2F28">
<meta name="description" content="Manual de campo Cobúe: temporada, calidad y recomendación de cada producto de fruta, verdura y setas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Campo Cobúe">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}.inst{display:none;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:0;background:var(--green);color:var(--on-green);font-weight:800;font-size:13px}.inst.on{display:inline-flex}</style>
<title>Manual de Campo Cobúe</title>
<style>
/* Layout: app de tienda. Móvil/PDA: barra superior + navegación inferior (Inicio · Catálogo · Calendario · Revisión).
   Tablet/PC ≥ 900px: navegación lateral fija y contenido a la derecha. Paleta Cobúe: marrón, verde, crema y tostado. */
:root{
  --bg:#F5EFE6; --surface:#FFFFFF; --surface-2:#FBF8F3; --ink:#3E2F28; --muted:#6E5D52; --faint:#9A8A7E; --line:#E3D7C6;
  --brand:#3E2F28; --brand-ink:#F5EFE6; --green:#6EAD80; --green-d:#46603F; --green-soft:#E1EEE4;
  --tan:#C6A182; --tan-d:#8A6748; --tan-soft:#F3E9DE; --bad:#A3412F; --bad-soft:#F7E3DE; --warn:#B07A2A; --warn-soft:#F7EBD6;
  --on-green:#132016; --shadow:0 1px 2px rgba(62,47,40,.06),0 4px 14px rgba(62,47,40,.06);
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --f-d:"Avenir Next","Segoe UI Variable Display","Segoe UI",-apple-system,Roboto,Arial,sans-serif;
  --r:12px; --r-s:8px; --nav-h:64px; --top-h:112px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1E1814; --surface:#2A221D; --surface-2:#251E19; --ink:#F2EBE1; --muted:#C4B5A8; --faint:#8E7F73; --line:#40342C;
  --brand:#14100D; --brand-ink:#F2EBE1; --green:#7FC092; --green-d:#A9D7B5; --green-soft:#24362A;
  --tan:#C9A688; --tan-d:#DDBB9C; --tan-soft:#3A2E25; --bad:#EE9C8C; --bad-soft:#43261F; --warn:#E3B568; --warn-soft:#3E3020;
  --on-green:#0F1A12; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1E1814; --surface:#2A221D; --surface-2:#251E19; --ink:#F2EBE1; --muted:#C4B5A8; --faint:#8E7F73; --line:#40342C;
  --brand:#14100D; --brand-ink:#F2EBE1; --green:#7FC092; --green-d:#A9D7B5; --green-soft:#24362A;
  --tan:#C9A688; --tan-d:#DDBB9C; --tan-soft:#3A2E25; --bad:#EE9C8C; --bad-soft:#43261F; --warn:#E3B568; --warn-soft:#3E3020;
  --on-green:#0F1A12; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--brand)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--brand);color:var(--brand-ink)}
.top .row{display:flex;align-items:center;gap:12px;min-height:56px}
.top .logo{height:24px;width:auto;display:block}
.top .app{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--green);padding-left:12px;border-left:1px solid rgba(245,239,230,.2);white-space:nowrap}
.top .sp{flex:1}
.mes{display:flex;align-items:center;gap:2px;background:rgba(245,239,230,.1);border-radius:999px;padding:3px}
.mes button{border:0;background:transparent;color:var(--brand-ink);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.mes button:hover{background:rgba(245,239,230,.12)}
.mes span{min-width:88px;text-align:center;font-weight:700;font-size:14px}
.top .search{padding-block:0 12px}
.sbox{position:relative}
.sbox input{width:100%;height:44px;border-radius:10px;border:1px solid transparent;background:rgba(245,239,230,.12);color:var(--brand-ink);padding:0 40px 0 42px;font-size:16px}
.sbox input::placeholder{color:rgba(245,239,230,.6)}
.sbox svg{position:absolute;left:14px;top:13px;stroke:var(--green)}
.top .sbox-wide{display:none;flex:1;max-width:460px}
.sbox .x{position:absolute;right:6px;top:6px;width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--brand-ink);font-size:18px}

/* ---------- navegación ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--nav-h);text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600}
.nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{color:var(--green-d)}
.nav a[aria-current="page"] svg{stroke-width:2.4}
.nav .nav-brand{display:none}
main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}

/* ---------- comunes ---------- */
.page{padding-block:18px 8px;display:flex;flex-direction:column;gap:22px;max-width:1180px;margin:0 auto;width:100%}
.ph-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1.t{font-family:var(--f-d);font-weight:600;font-size:clamp(24px,5.6vw,32px);line-height:1.1;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
h2.s{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin:0;display:flex;align-items:center;gap:8px}
h2.s .c{font-weight:600;color:var(--faint);letter-spacing:0;text-transform:none;font-size:13px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.link{border:0;background:transparent;color:var(--green-d);font-weight:700;font-size:14px;padding:6px 0;text-decoration:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;height:38px;font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
a.chip{color:var(--ink);text-decoration:none}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{opacity:.6;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-best{background:var(--green);color:var(--on-green)}
.s-on{background:var(--green-soft);color:var(--green-d)}
.s-new{background:var(--warn-soft);color:var(--warn)}
.s-out{background:var(--tan-soft);color:var(--tan-d)}
.s-td{background:var(--tan-soft);color:var(--tan-d)}
.s-off{background:transparent;color:var(--faint);border:1px dashed var(--line)}
.s-blk{background:var(--bad-soft);color:var(--bad)}
.empty{padding:40px 12px;text-align:center;color:var(--muted)}

/* sprite de fotos */
.img{position:relative;background:#fff;overflow:hidden}
.spr{position:absolute;inset:0;background-repeat:no-repeat}
.noimg{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#8a7a6e;font-style:italic}

/* ---------- inicio ---------- */
.hello{background:var(--brand);color:var(--brand-ink);border-radius:var(--r);padding:20px;display:grid;gap:16px;position:relative;overflow:hidden}
.hello .eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--green)}
.hello h1{font-family:var(--f-d);font-weight:600;font-size:clamp(26px,6vw,36px);line-height:1.08;margin:4px 0 0;text-wrap:balance}
.hello p{margin:6px 0 0;color:rgba(245,239,230,.75);max-width:52ch}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{display:flex;flex-direction:column;gap:2px;text-align:left;background:rgba(245,239,230,.08);border:1px solid rgba(245,239,230,.12);border-radius:10px;padding:12px 14px;color:inherit}
.kpi:hover{background:rgba(245,239,230,.14)}
.kpi b{font-family:var(--f-d);font-size:28px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:rgba(245,239,230,.78)}
.kpi i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.rail>*{scroll-snap-align:start}
.secret{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;background:var(--tan-soft);border:1px solid var(--tan);border-radius:var(--r);padding:12px;text-align:left;width:100%}
.secret .img{width:84px;aspect-ratio:4/3;border-radius:8px}
.secret p{margin:4px 0 0;font-size:15px}
.secret .lbl{color:var(--tan-d)}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.catc{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:14px;font-weight:700;text-align:left}
.catc small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
.catc .n{font-family:var(--f-d);font-size:22px;color:var(--green-d);font-variant-numeric:tabular-nums}

/* ---------- tarjetas producto ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.card{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;padding:0;min-width:0;text-decoration:none;color:inherit;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:var(--shadow)}
.card .img{aspect-ratio:4/3;border-bottom:1px solid var(--line)}
.card .tx{padding:10px 11px 12px;display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.card .nm{font-family:var(--f-d);font-weight:600;font-size:15.5px;line-height:1.2;text-wrap:balance}
.card .mt{font-size:12px;color:var(--muted)}
.card .pill{margin-top:auto;align-self:flex-start}
.card .tx .pill{margin-top:6px}
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rowp{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 12px 8px 8px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;min-height:64px}
.rowp:last-child{border-bottom:0}
.rowp .img{width:64px;aspect-ratio:4/3;border-radius:6px}
.rowp .nm{font-weight:700;font-size:15px;line-height:1.2}
.rowp .mt{font-size:12.5px;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:7px;height:32px;padding:0 10px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.count{font-size:13px;color:var(--muted)}
.sel{height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px;font-size:13.5px;font-weight:600}

/* ---------- ficha ---------- */
.dhead{display:flex;align-items:center;gap:8px;justify-content:space-between}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--green-d);font-weight:700;height:40px;padding:0;text-decoration:none}
.pn{display:flex;gap:6px}
.pn a{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);font-size:18px}
.pn a[aria-disabled="true"]{opacity:.35;pointer-events:none}
.hero{display:grid;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.hero .img{border-radius:8px;aspect-ratio:4/3}
.hero .kick{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green-d)}
.hero .kick span{color:var(--tan-d)}
.hero h1{font-family:var(--f-d);font-weight:600;font-size:clamp(28px,7vw,40px);line-height:1.04;margin:6px 0 4px;letter-spacing:-.015em;color:var(--green-d);text-wrap:balance}
.hero .lat{font-style:italic;color:var(--muted);font-size:14px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.fact{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
.fact b{display:block;font-size:14px;line-height:1.25;margin-top:2px}
.anchors{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h));z-index:20;background:var(--bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.anchors a{text-decoration:none}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;scroll-margin-top:calc(var(--top-h) + 70px)}
.blk>h2.s{padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.blk>h2.s::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--green)}
.blk.t>h2.s::before{background:var(--tan)} .blk.d>h2.s::before{background:var(--ink)}
.temp{margin:0 0 12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.cal .m{font-size:10.5px;text-align:center;color:var(--faint);text-transform:uppercase;font-weight:700}
.cal .m.now{color:var(--ink)}
.cal .c{height:24px;border-radius:4px;border:1px dashed var(--line)}
.cal .c.on{background:var(--green-soft);border:0}
.cal .c.td{background:var(--tan-soft);border:1px solid var(--tan)}
.cal .c.best{background:var(--green);border:0}
.cal .c.now{box-shadow:0 0 0 2px var(--ink) inset}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.orig{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px}
.orig li{display:grid;grid-template-columns:78px 1fr;gap:10px;font-size:14px}
.orig li.now{font-weight:700}
.orig b{color:var(--green-d)}
.sens{display:grid;gap:12px}
.sens>div{background:var(--surface-2);border-radius:8px;padding:11px 13px}
.sens p{margin:3px 0 0;font-size:15.5px}
.usos{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.usos li{background:var(--green-soft);color:var(--green-d);border-radius:8px;padding:7px 11px;font-size:14px;font-weight:600}
.tip{background:var(--green);color:var(--on-green);border-radius:var(--r);padding:16px;display:grid;gap:4px}
.tip .lbl{color:var(--on-green);opacity:.75}
.tip p{margin:0;font-size:16.5px;font-weight:650}
.sec2{background:var(--tan-soft);border:1px solid var(--tan);border-radius:var(--r);padding:16px;display:grid;gap:4px}
.sec2 .lbl{color:var(--tan-d)}
.sec2 p{margin:0;font-size:16px}
.evo{margin:0 0 14px;color:var(--muted);font-style:italic}
.states{display:grid;gap:10px}
.st{display:grid;grid-template-columns:120px 1fr;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;position:relative}
.st::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:5px;border-radius:10px 0 0 10px;background:var(--green)}
.st.u::before{background:var(--tan)} .st.x::before{background:var(--bad)}
.st .img{width:120px;aspect-ratio:4/3;border-radius:6px;align-self:start}
.st .lb{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.st.a .lb{color:var(--green-d)} .st.u .lb{color:var(--tan-d)} .st.x .lb{color:var(--bad)}
.st .ac{display:inline-block;font-size:11.5px;font-weight:700;margin:3px 0 4px;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.st p{margin:0;font-size:14px}
.gen{font-size:12px;color:var(--faint);margin-top:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.kv dt{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.kv dd{margin:0}
.alg{display:grid;gap:6px}
.alg .lg{display:inline-flex;align-items:center;gap:8px;font-weight:800}
.alg .lg.no{color:var(--green-d)} .alg .lg.si{color:var(--bad)}
.alg p{margin:0;font-size:14px;color:var(--muted)}
.foot{color:var(--faint);font-size:12px;text-align:center;padding-block:8px 0}

/* ---------- calendario ---------- */
.ctab{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.crow{display:grid;grid-template-columns:minmax(110px,34%) repeat(12,minmax(0,1fr));align-items:center;gap:2px;padding:5px 8px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;min-height:38px}
.crow:hover{background:var(--surface-2)}
.crow .nm{font-size:13px;font-weight:600;line-height:1.2;padding-right:6px;overflow:hidden;text-overflow:ellipsis}
.crow .c{height:18px;border-radius:3px}
.crow .c.on{background:var(--green-soft)} .crow .c.best{background:var(--green)} .crow .c.td{background:var(--tan-soft);box-shadow:inset 0 0 0 1px var(--tan)}
.crow .c.now{box-shadow:inset 0 0 0 2px var(--ink)}
.chead{background:var(--surface-2);font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;min-height:30px}
.chead span{text-align:center}
.chead span.now{color:var(--ink)}
.cgroup{padding:10px 12px 6px;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green-d);background:var(--surface);border-bottom:1px solid var(--line)}

/* ---------- revisión ---------- */
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .25s}
.rv{display:grid;grid-template-columns:44px 64px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px 10px 6px;border-bottom:1px solid var(--line)}
.rv:last-child{border-bottom:0}
.rv.ok{background:var(--surface-2)}
.rv.ok .rtx{opacity:.55}
.chk{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center}
.chk span{width:26px;height:26px;border-radius:7px;border:2px solid var(--faint);display:grid;place-items:center;color:transparent;font-weight:900}
.rv.ok .chk span{background:var(--green);border-color:var(--green);color:var(--on-green)}
.rv .img{width:64px;aspect-ratio:4/3;border-radius:6px}
.rtx a{font-weight:700;color:inherit;text-decoration:none}
.rtx .r{font-size:13px;margin-top:3px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
.rtx .r b{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.rtx .r .bu{color:var(--tan-d)} .rtx .r .bx{color:var(--bad)}
.btn{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-weight:700;font-size:14px}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- responsive ---------- */
@media (min-width:600px){
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .sens{grid-template-columns:repeat(3,minmax(0,1fr))}
  .states{grid-template-columns:repeat(3,minmax(0,1fr))}
  .st{grid-template-columns:1fr}
  .st .img{width:100%}
  .hero{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center;padding:16px;gap:24px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rail{grid-auto-columns:170px}
}
@media (min-width:900px){
  body{padding-left:220px}
  .nav{top:0;bottom:0;right:auto;width:220px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 14px) 12px 14px max(12px,env(safe-area-inset-left,0px));gap:4px;background:var(--surface)}
  .nav .nav-brand{display:block;padding:6px 10px 18px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .nav a{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;height:46px;padding:0 12px;border-radius:10px;font-size:14.5px}
  .nav a[aria-current="page"]{background:var(--green-soft)}
  main{padding-bottom:40px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .tip-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
}
@media (max-width:599px){ .top .app{display:none} }
@media (min-width:600px){ :root{--top-h:56px} .top .search{display:none} .top .sbox-wide{display:block} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;scroll-behavior:auto!important} }
</style>
</head>
<body>


<header class="top">
  <div class="gut">
    <div class="row">
      <img class="logo" src="logo.png" alt="Cobúe">
      <span class="app">Manual de campo</span>
      <div class="sp"></div>
      <div class="sbox sbox-wide"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q2" type="search" placeholder="Buscar producto, uso, sabor…" aria-label="Buscar" autocomplete="off"></div>
      <button class="inst" id="inst" aria-label="Instalar la app">Instalar</button>
      <div class="mes" role="group" aria-label="Mes de trabajo"><button id="mPrev" aria-label="Mes anterior">‹</button><span id="mName" class="num"></span><button id="mNext" aria-label="Mes siguiente">›</button></div>
    </div>
    <div class="search"><div class="sbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Buscar producto, uso, sabor…" aria-label="Buscar" autocomplete="off"></div></div>
  </div>
</header>

<nav class="nav" aria-label="Secciones">
  <span class="nav-brand">Cobúe · Campo</span>
  <a href="#inicio" data-v="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Inicio</a>
  <a href="#catalogo" data-v="catalogo"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Catálogo</a>
  <a href="#calendario" data-v="calendario"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</a>
  <a href="#revision" data-v="revision"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Revisión</a>
</nav>

<main class="gut" id="main" tabindex="-1"><div class="page"><div class="empty">Cargando el manual…</div></div></main>

<script>
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const slug=s=>s.normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('campo2-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('campo2-'+k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
const pad=(n,l)=>String(n).padStart(l,'0');
let DATA=[], BYID={};
const S={mes:new Date().getMonth(),q:'',cat:LS.get('cat','Todas'),sub:'Todas',est:'todos',vista:LS.get('vista','grid'),orden:'manual',calCat:LS.get('calCat','Fruta'),revCat:'Todas',revSolo:false};

/* ---- lógica de temporada ---- */
const mm=m=>(m+12)%12;
function enTienda(p,m){ m=mm(m); if(p.td&&p.td.length) return p.td.includes(m); return p.venta.some(([a,b,t,s])=>s!=='n'&&m>=a&&m<b); }
const todoAnio=p=>[...Array(12).keys()].every(m=>enTienda(p,m));
const best=(p,m)=>(p.pico||[]).includes(mm(m))&&enTienda(p,m);
const entra=(p,m)=>enTienda(p,m)&&!enTienda(p,m-1)&&!todoAnio(p);
const sale=(p,m)=>enTienda(p,m)&&!enTienda(p,m+1)&&!todoAnio(p);
const finde=p=>p.td&&p.td.length;
function estado(p,m){
  if(!p.venta.length&&!finde(p)) return ['s-blk','Bloqueada'];
  if(!enTienda(p,m)) return ['s-off','No se trabaja'];
  if(best(p,m)) return ['s-best','Mejor momento'];
  if(entra(p,m)) return ['s-new','Entra este mes'];
  if(sale(p,m)) return ['s-out','Último mes'];
  if(finde(p)) return ['s-td','Fin de semana'];
  return ['s-on','En tienda'];
}
function origenMes(p,m){ const o=p.origen.find(([a,b,t,s])=>s!=='n'&&m>=a&&m<b); return o?o[2]:null; }

/* ---- fotos (hojas JPEG) ---- */
function TH(p){ if(!p.foto) return '<span class="noimg">Foto pendiente</span>'; const [s,c,r]=p.th;
  return `<div class="spr" role="img" aria-label="${esc(p.ref)}" style="background-image:url(t-${pad(s,2)}.jpg);background-size:600% 500%;background-position:${c*20}% ${r*25}%"></div>`; }
function DT(p,c,alt){ const [s,r]=p.dt;
  return `<div class="spr" role="img" aria-label="${esc(alt)}" style="background-image:url(d-${pad(s,3)}.jpg);background-size:400% 400%;background-position:${c*100/3}% ${r*100/3}%"></div>`; }

/* ---- componentes ---- */
function card(p){ const [c,t]=estado(p,S.mes);
  return `<a class="card" href="#p-${p.id}"><div class="img">${TH(p)}</div><div class="tx"><span class="nm">${esc(p.ref)}</span><span class="mt">${esc(p.sub)}${p.fmt?' · '+esc(p.fmt):''}</span><span class="pill ${c}">${t}</span></div></a>`; }
function rowp(p,extra){ const [c,t]=estado(p,S.mes);
  return `<a class="rowp" href="#p-${p.id}"><div class="img">${TH(p)}</div><div><div class="nm">${esc(p.ref)}</div><div class="mt">${esc(p.sub)}${p.fmt?' · '+esc(p.fmt):''}${extra?' · '+extra:''}</div></div><span class="pill ${c}">${t}</span></a>`; }
const chipsHTML=(list,cur,attr)=>list.map(([v,l,n])=>`<button class="chip" ${attr}="${esc(v)}" aria-pressed="${cur===v}">${esc(l)}${n!=null?`<span class="n num">${n}</span>`:''}</button>`).join('');

/* ---- INICIO ---- */
function vInicio(){
  const m=S.mes, on=DATA.filter(p=>enTienda(p,m)), b=on.filter(p=>best(p,m)), n=on.filter(p=>entra(p,m)), o=on.filter(p=>sale(p,m)), f=on.filter(finde);
  const doy=Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/864e5);
  const sec=DATA.filter(p=>p.pepita&&enTienda(p,m)); const sp=sec.length?sec[doy%sec.length]:DATA[0];
  const cats=[...new Set(DATA.map(p=>p.cat))];
  const kpi=(v,l,col,est)=>`<button class="kpi" data-go="${est}"><b>${v}</b><span><i style="background:${col}"></i>${l}</span></button>`;
  const rail=(L,empty)=>L.length?`<div class="rail">${L.map(card).join('')}</div>`:`<div class="count">${empty}</div>`;
  return `<section class="hello">
    <div><div class="eyebrow">${MESES[m]} · surtido de campo</div><h1>Qué hay en tienda este mes</h1><p>Temporada, calidad y cómo recomendar cada producto. Cambia el mes arriba para preparar el siguiente.</p></div>
    <div class="kpis">${kpi(on.length,'En tienda','var(--green-soft)','tienda')}${kpi(b.length,'Mejor momento','var(--green)','mejor')}${kpi(n.length,'Entran este mes','var(--warn)','entra')}${kpi(o.length,'Último mes','var(--tan)','sale')}</div>
  </section>
  <button class="secret" data-href="#p-${sp.id}"><div class="img">${TH(sp)}</div><div><div class="lbl">Secreto de la huerta del día · ${esc(sp.ref)}</div><p>${esc(sp.pepita)}</p></div></button>
  <section><div class="sec-h"><h2 class="s">En su mejor momento <span class="c num">${b.length}</span></h2><button class="link" data-go="mejor">Ver todos</button></div>${rail(b,'Ningún producto en su mejor momento este mes.')}</section>
  <section><div class="sec-h"><h2 class="s">Entran este mes <span class="c num">${n.length}</span></h2><button class="link" data-go="entra">Ver todos</button></div>${rail(n,'No entra ninguna referencia nueva este mes.')}</section>
  <section><div class="sec-h"><h2 class="s">Último mes en tienda <span class="c num">${o.length}</span></h2><button class="link" data-go="sale">Ver todos</button></div>${rail(o,'Ninguna referencia se despide este mes.')}</section>
  ${f.length?`<section><div class="sec-h"><h2 class="s">Fines de semana <span class="c num">${f.length}</span></h2><button class="link" data-go="finde">Ver todos</button></div>${rail(f,'')}</section>`:''}
  <section><div class="sec-h"><h2 class="s">Categorías</h2></div><div class="cats">${cats.map(c=>{const L=DATA.filter(p=>p.cat===c);return `<button class="catc" data-cat="${esc(c)}"><span>${esc(c)}<small>${L.filter(p=>enTienda(p,m)).length} en tienda en ${MC[m]}</small></span><span class="n">${L.length}</span></button>`}).join('')}</div></section>
  <div class="foot">Cosas Buenas S.L. · Manual de campo · Documento interno</div>`;
}

/* ---- CATÁLOGO ---- */
const ESTF=[['todos','Todos'],['tienda','En tienda'],['mejor','Mejor momento'],['entra','Entran'],['sale','Último mes'],['finde','Fin de semana']];
function filtrar(){
  const q=slug(S.q).replace(/-/g,' ').trim(), m=S.mes;
  const fe={todos:()=>true,tienda:p=>enTienda(p,m),mejor:p=>best(p,m),entra:p=>entra(p,m),sale:p=>sale(p,m),finde:p=>finde(p)&&enTienda(p,m)}[S.est];
  let L=DATA.filter(p=>(S.cat==='Todas'||p.cat===S.cat)&&(S.sub==='Todas'||p.sub===S.sub)&&fe(p)&&(!q||p._s.includes(q)));
  if(S.orden==='az') L=[...L].sort((a,b)=>a.ref.localeCompare(b.ref,'es'));
  return L;
}
function vCatalogo(){
  const cats=['Todas',...new Set(DATA.map(p=>p.cat))];
  const subs=S.cat==='Todas'?[]:['Todas',...new Set(DATA.filter(p=>p.cat===S.cat).map(p=>p.sub))];
  const L=filtrar(); window._last=L.map(p=>p.id);
  return `<div class="ph-title"><div><div class="lbl">Catálogo · ${MESES[S.mes]}</div><h1 class="t">${S.q?`Resultados para “${esc(S.q)}”`:S.cat==='Todas'?'Todo el surtido':esc(S.cat)}</h1></div></div>
  <div style="display:grid;gap:8px">
    <div class="chips" id="fCat">${chipsHTML(cats.map(c=>[c,c,c==='Todas'?DATA.length:DATA.filter(p=>p.cat===c).length]),S.cat,'data-c')}</div>
    ${subs.length?`<div class="chips" id="fSub">${chipsHTML(subs.map(s=>[s,s==='Todas'?'Todas las subcategorías':s,null]),S.sub,'data-s')}</div>`:''}
    <div class="chips" id="fEst">${chipsHTML(ESTF.map(([v,l])=>[v,l,null]),S.est,'data-e')}</div>
  </div>
  <div class="toolbar"><span class="count num">${L.length} ${L.length===1?'producto':'productos'}</span>
    <div style="display:flex;gap:8px;align-items:center">
      <select class="sel" id="fOrd" aria-label="Orden"><option value="manual" ${S.orden==='manual'?'selected':''}>Orden del surtido</option><option value="az" ${S.orden==='az'?'selected':''}>A–Z</option></select>
      <div class="seg" role="group" aria-label="Vista"><button data-vista="grid" aria-pressed="${S.vista==='grid'}">Fotos</button><button data-vista="list" aria-pressed="${S.vista==='list'}">Lista</button></div>
    </div></div>
  ${!L.length?'<div class="empty">No hay productos con estos filtros. Quita alguno o prueba otra palabra.</div>':S.vista==='grid'?`<div class="grid">${L.map(card).join('')}</div>`:`<div class="rows">${L.map(p=>rowp(p)).join('')}</div>`}`;
}

/* ---- FICHA ---- */
function calHTML(p){ const m=S.mes, td=finde(p);
  let h='<div class="cal">'+MC.map((x,i)=>`<div class="m ${i===m?'now':''}">${x}</div>`).join('');
  h+=MC.map((x,i)=>{let c='c'; if(enTienda(p,i)) c+=best(p,i)?' best':(td?' td':' on'); if(i===m) c+=' now'; return `<div class="${c}" title="${MESES[i]}"></div>`}).join('')+'</div>';
  h+=`<div class="legend"><span><i style="background:var(--green-soft)"></i>En tienda</span><span><i style="background:var(--green)"></i>Mejor momento</span>${td?'<span><i style="background:var(--tan-soft);border:1px solid var(--tan)"></i>1.er fin de semana</span>':''}<span><i style="border:1px dashed var(--line)"></i>No se trabaja</span></div>`;
  const og=p.origen.filter(o=>o[3]!=='n');
  if(og.length) h+='<ul class="orig">'+og.map(([a,b,t])=>`<li class="${m>=a&&m<b?'now':''}"><b class="num">${MC[a]}${b-a>1?'–'+MC[b-1]:''}</b><span>${esc(t)}</span></li>`).join('')+'</ul>';
  return h; }
function vFicha(id){
  const p=BYID[id]; if(!p) return '<div class="empty">No encuentro este producto. <a href="#catalogo">Volver al catálogo</a></div>';
  const list=window._last&&window._last.includes(id)?window._last:DATA.map(x=>x.id); const i=list.indexOf(id);
  const prev=list[i-1], next=list[i+1]; const [c,t]=estado(p,S.mes); const og=origenMes(p,S.mes);
  const A=p.al||{legal:'Ninguno',nota:''}; const none=/^ninguno$/i.test(A.legal);
  const est=[['a','Apta','Mantener en exposición',p.apta,1],['u','Última vida','Retirar y transformar',p.ultima,2],['x','Inasumible','Retirar del lineal',p.inasumible,3]];
  return `<div class="dhead"><a class="back" href="${S.back||'#catalogo'}">‹ Volver</a><div class="pn"><a href="#p-${prev||''}" aria-label="Anterior" aria-disabled="${!prev}">‹</a><a href="#p-${next||''}" aria-label="Siguiente" aria-disabled="${!next}">›</a></div></div>
  <section class="hero"><div class="img">${p.foto?DT(p,0,p.ref):'<span class="noimg">Foto pendiente</span>'}</div>
    <div><div class="kick">${esc(p.cat)} <span>· ${esc(p.sub)}</span></div><h1>${esc(p.ref)}</h1><div class="lat">${esc(p.lat)}</div>
      <div class="facts">
        <div class="fact"><span class="lbl">${MESES[S.mes]}</span><b><span class="pill ${c}">${t}</span></b></div>
        <div class="fact"><span class="lbl">Formato</span><b>${esc(p.fmt||'—')}</b></div>
        <div class="fact" style="grid-column:1/-1"><span class="lbl">Origen este mes</span><b>${og?esc(og):'No se trabaja este mes'}</b></div>
      </div></div></section>
  <div class="anchors"><div class="chips"><a class="chip" href="#" data-a="s-temp">Temporada</a><a class="chip" href="#" data-a="s-como">Cómo es</a><a class="chip" href="#" data-a="s-usos">Usos</a><a class="chip" href="#" data-a="s-cal">Calidad</a><a class="chip" href="#" data-a="s-cons">Conservación</a><a class="chip" href="#" data-a="s-alg">Alérgenos</a></div></div>
  <section class="blk" id="s-temp"><h2 class="s">Temporada · cuándo entra</h2><p class="temp">${esc(p.temporada)}</p>${calHTML(p)}</section>
  <section class="blk d" id="s-como"><h2 class="s">Cómo es</h2><div class="sens"><div><span class="lbl">Sabor</span><p>${esc(p.sabor)}</p></div><div><span class="lbl">Aroma</span><p>${esc(p.aroma)}</p></div><div><span class="lbl">Textura</span><p>${esc(p.textura)}</p></div></div></section>
  <section class="blk" id="s-usos"><h2 class="s">Usos culinarios</h2><ul class="usos">${p.usos.map(u=>`<li>${esc(u)}</li>`).join('')}</ul></section>
  <div class="tip-row" style="display:grid;gap:14px"><div class="tip"><span class="lbl">Al cliente</span><p>${esc(p.consejo)}</p></div>${p.pepita?`<div class="sec2"><span class="lbl">Secretos de la huerta</span><p>${esc(p.pepita)}</p></div>`:''}</div>
  <section class="blk t" id="s-cal"><h2 class="s">Calidad · cuándo está mal</h2><p class="evo">${esc(p.evolucion)}</p><div class="states">
    ${est.map(([k,l,a,tx,n])=>`<div class="st ${k}"><div class="img">${p.est[n-1]?DT(p,n,l+' · '+p.ref):'<span class="noimg">Foto pendiente</span>'}</div><div><div class="lb">${l}</div><span class="ac">${a}</span><p>${esc(tx)}</p></div></div>`).join('')}
    </div>${p.gen?'<div class="gen">Fotos de estado orientativas, generadas a partir de la foto de la ficha.</div>':''}</section>
  <section class="blk t" id="s-cons"><h2 class="s">Conservación</h2><dl class="kv"><dt>Tienda</dt><dd>${esc(p.tienda)}</dd><dt>En casa</dt><dd>${esc(p.casa)}</dd></dl></section>
  <section class="blk t" id="s-alg"><h2 class="s">Alérgenos</h2><div class="alg"><span class="lg ${none?'no':'si'}">Lista UE (14 de declaración obligatoria): ${esc(A.legal.toLowerCase())}</span>${A.nota?`<p>${esc(A.nota)}</p>`:''}</div></section>
  <div class="foot">Cosas Buenas S.L. · Manual de campo · Documento interno</div>`;
}

/* ---- CALENDARIO ---- */
function vCalendario(){
  const cats=[...new Set(DATA.map(p=>p.cat))]; const m=S.mes;
  const L=DATA.filter(p=>p.cat===S.calCat); const subs=[...new Set(L.map(p=>p.sub))];
  const row=p=>`<a class="crow" href="#p-${p.id}"><span class="nm">${esc(p.ref)}</span>${MC.map((x,i)=>{let c='c'; if(enTienda(p,i)) c+=best(p,i)?' best':(finde(p)?' td':' on'); if(i===m) c+=' now'; return `<span class="${c}"></span>`}).join('')}</a>`;
  return `<div class="ph-title"><div><div class="lbl">Calendario comercial</div><h1 class="t">Cuándo entra cada producto</h1></div></div>
  <div class="chips" id="fCal">${chipsHTML(cats.map(c=>[c,c,DATA.filter(p=>p.cat===c).length]),S.calCat,'data-cc')}</div>
  <div class="legend" style="margin:0"><span><i style="background:var(--green-soft)"></i>En tienda</span><span><i style="background:var(--green)"></i>Mejor momento</span><span><i style="background:var(--tan-soft);border:1px solid var(--tan)"></i>Fin de semana</span><span><i style="box-shadow:inset 0 0 0 2px var(--ink)"></i>${MESES[m]}</span></div>
  <div class="ctab"><div class="crow chead"><span>Producto</span>${MC.map((x,i)=>`<span class="${i===m?'now':''}">${x[0]}</span>`).join('')}</div>
  ${subs.map(s=>`<div class="cgroup">${esc(s)} · <span class="num">${L.filter(p=>p.sub===s).length}</span></div>`+L.filter(p=>p.sub===s).map(row).join('')).join('')}</div>`;
}

/* ---- REVISIÓN ---- */
const hoyKey=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)};
let REV=LS.get('rev-'+hoyKey(),{});
function vRevision(){
  const m=S.mes, cats=['Todas',...new Set(DATA.map(p=>p.cat))];
  let L=DATA.filter(p=>enTienda(p,m)&&(S.revCat==='Todas'||p.cat===S.revCat));
  const done=L.filter(p=>REV[p.id]).length; if(S.revSolo) L=L.filter(p=>!REV[p.id]);
  const pct=L.length||done?Math.round(done/(DATA.filter(p=>enTienda(p,m)&&(S.revCat==='Todas'||p.cat===S.revCat)).length||1)*100):0;
  const total=DATA.filter(p=>enTienda(p,m)&&(S.revCat==='Todas'||p.cat===S.revCat)).length;
  return `<div class="ph-title"><div><div class="lbl">Revisión de lineal · hoy</div><h1 class="t">Qué retirar y qué transformar</h1></div></div>
  <div class="prog"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><b class="num">${done} de ${total} revisados</b><div style="display:flex;gap:8px"><button class="btn ${S.revSolo?'p':''}" id="rSolo">${S.revSolo?'Ver todos':'Solo pendientes'}</button><button class="btn" id="rReset">Empezar de nuevo</button></div></div><div class="bar"><i style="width:${pct}%"></i></div><span class="count">Productos en tienda en ${MESES[m].toLowerCase()}. Marca cada uno al revisarlo; la lista se reinicia cada día.</span></div>
  <div class="chips" id="fRev">${chipsHTML(cats.map(c=>[c,c,null]),S.revCat,'data-rc')}</div>
  ${L.length?`<div class="rows">${L.map(p=>`<div class="rv ${REV[p.id]?'ok':''}"><button class="chk" data-rv="${p.id}" aria-pressed="${!!REV[p.id]}" aria-label="Revisado: ${esc(p.ref)}"><span>✓</span></button><div class="img">${TH(p)}</div><div class="rtx"><a href="#p-${p.id}">${esc(p.ref)}</a> <span class="count">· ${esc(p.fmt)}</span><div class="r"><b class="bu">Transformar</b><span>${esc(p.ultima)}</span><b class="bx">Retirar</b><span>${esc(p.inasumible)}</span></div></div></div>`).join('')}</div>`:'<div class="empty">Todo revisado. Buen trabajo.</div>'}`;
}

/* ---- router ---- */
let VIEW='inicio';
function render(){
  const h=location.hash.replace('#','')||'inicio';
  const isP=h.startsWith('p-'); VIEW=isP?'ficha':(['inicio','catalogo','calendario','revision'].includes(h)?h:'inicio');
  if(!isP) S.back='#'+VIEW;
  document.querySelectorAll('.nav a').forEach(a=>a.setAttribute('aria-current',a.dataset.v===(isP?(S.back||'#catalogo').slice(1):VIEW)?'page':'false'));
  $('mName').textContent=MESES[S.mes];
  const html=isP?vFicha(h.slice(2)):({inicio:vInicio,catalogo:vCatalogo,calendario:vCalendario,revision:vRevision}[VIEW])();
  $('main').innerHTML=`<div class="page">${html}</div>`;
}
function go(hash){ if(location.hash===hash) render(); else location.hash=hash; }
addEventListener('hashchange',()=>{ render(); scrollTo(0,0); });

$('main').addEventListener('click',e=>{
  const t=e.target.closest('button,a'); if(!t) return;
  if(t.dataset.go){ S.est=t.dataset.go==='finde'?'finde':t.dataset.go; S.cat='Todas'; S.sub='Todas'; S.q=''; $('q').value=$('q2').value=''; go('#catalogo'); }
  else if(t.dataset.href){ go(t.dataset.href); }
  else if(t.dataset.cat){ S.cat=t.dataset.cat; S.sub='Todas'; S.est='todos'; LS.set('cat',S.cat); go('#catalogo'); }
  else if(t.dataset.c!=null){ S.cat=t.dataset.c; S.sub='Todas'; LS.set('cat',S.cat); render(); }
  else if(t.dataset.s!=null){ S.sub=t.dataset.s; render(); }
  else if(t.dataset.e!=null){ S.est=t.dataset.e; render(); }
  else if(t.dataset.vista){ S.vista=t.dataset.vista; LS.set('vista',S.vista); render(); }
  else if(t.dataset.cc){ S.calCat=t.dataset.cc; LS.set('calCat',S.calCat); render(); }
  else if(t.dataset.rc){ S.revCat=t.dataset.rc; render(); }
  else if(t.dataset.rv){ const id=t.dataset.rv; REV[id]=!REV[id]; if(!REV[id]) delete REV[id]; LS.set('rev-'+hoyKey(),REV); const y=scrollY; render(); scrollTo(0,y); }
  else if(t.id==='rSolo'){ S.revSolo=!S.revSolo; render(); }
  else if(t.id==='rReset'){ REV={}; LS.set('rev-'+hoyKey(),REV); render(); }
  else if(t.dataset.a){ e.preventDefault(); const el=$(t.dataset.a); if(el) el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}); }
});
$('main').addEventListener('change',e=>{ if(e.target.id==='fOrd'){ S.orden=e.target.value; render(); } });
$('mPrev').onclick=()=>{ S.mes=mm(S.mes-1); render(); };
$('mNext').onclick=()=>{ S.mes=mm(S.mes+1); render(); };
let tq; const onQ=e=>{ clearTimeout(tq); const v=e.target.value; $('q').value=$('q2').value=v; tq=setTimeout(()=>{ S.q=v; if(v){ S.cat='Todas'; S.sub='Todas'; S.est='todos'; } if(VIEW!=='catalogo'||location.hash!=='#catalogo') go('#catalogo'); else { render(); } const inp=e.target; requestAnimationFrame(()=>inp.focus()); },160); };
$('q').addEventListener('input',onQ); $('q2').addEventListener('input',onQ);

fetch('campo.json').then(r=>r.json()).then(d=>{
  DATA=d.map(p=>Object.assign(p,{_s:slug([p.ref,p.cat,p.sub,p.lat,p.fmt,p.sabor,p.aroma,p.textura,p.usos.join(' '),p.pepita||''].join(' ')).replace(/-/g,' ')}));
  DATA.forEach(p=>BYID[p.id]=p);
  if(!['Todas',...new Set(DATA.map(p=>p.cat))].includes(S.cat)) S.cat='Todas';
  render();
}).catch(()=>{ $('main').innerHTML='<div class="page"><div class="empty">No se han podido cargar los datos. Recarga la página.</div></div>'; });
</script>

<script>
if('serviceWorker' in navigator){ addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
let _dp=null; addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); _dp=e; const b=document.getElementById('inst'); if(b) b.classList.add('on'); });
addEventListener('appinstalled',()=>{ const b=document.getElementById('inst'); if(b) b.classList.remove('on'); });
document.addEventListener('click',e=>{ if(e.target.closest('#inst')&&_dp){ _dp.prompt(); _dp.userChoice.finally(()=>{_dp=null; document.getElementById('inst').classList.remove('on');}); } });
</script>
</body>
