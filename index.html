<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3E2F28">
<meta name="description" content="Manual de campo Cobúe: temporada, calidad y recomendación de cada producto de fruta, verdura y setas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Campo Cobúe">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}.inst{display:none;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:0;background:var(--green);color:var(--on-green);font-weight:800;font-size:13px}.inst.on{display:inline-flex}</style>
<title>Manual de Campo Cobúe</title>
<style>
/* Layout: app de tienda. Móvil/PDA: barra superior + navegación inferior (Inicio · Catálogo · Calendario · Revisión).
   Tablet/PC ≥ 900px: navegación lateral fija y contenido a la derecha. Paleta Cobúe: marrón, verde, crema y tostado. */
:root{
  --bg:#F5EFE6; --surface:#FFFFFF; --surface-2:#FBF8F3; --ink:#3E2F28; --muted:#6E5D52; --faint:#9A8A7E; --line:#E3D7C6;
  --brand:#3E2F28; --brand-ink:#F5EFE6; --green:#6EAD80; --green-d:#46603F; --green-soft:#E1EEE4;
  --tan:#C6A182; --tan-d:#8A6748; --tan-soft:#F3E9DE; --bad:#A3412F; --bad-soft:#F7E3DE; --warn:#B07A2A; --warn-soft:#F7EBD6;
  --on-green:#132016; --shadow:0 1px 2px rgba(62,47,40,.06),0 4px 14px rgba(62,47,40,.06);
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --f-d:"Avenir Next","Segoe UI Variable Display","Segoe UI",-apple-system,Roboto,Arial,sans-serif;
  --r:12px; --r-s:8px; --nav-h:64px; --top-h:112px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1E1814; --surface:#2A221D; --surface-2:#251E19; --ink:#F2EBE1; --muted:#C4B5A8; --faint:#8E7F73; --line:#40342C;
  --brand:#14100D; --brand-ink:#F2EBE1; --green:#7FC092; --green-d:#A9D7B5; --green-soft:#24362A;
  --tan:#C9A688; --tan-d:#DDBB9C; --tan-soft:#3A2E25; --bad:#EE9C8C; --bad-soft:#43261F; --warn:#E3B568; --warn-soft:#3E3020;
  --on-green:#0F1A12; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1E1814; --surface:#2A221D; --surface-2:#251E19; --ink:#F2EBE1; --muted:#C4B5A8; --faint:#8E7F73; --line:#40342C;
  --brand:#14100D; --brand-ink:#F2EBE1; --green:#7FC092; --green-d:#A9D7B5; --green-soft:#24362A;
  --tan:#C9A688; --tan-d:#DDBB9C; --tan-soft:#3A2E25; --bad:#EE9C8C; --bad-soft:#43261F; --warn:#E3B568; --warn-soft:#3E3020;
  --on-green:#0F1A12; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--brand)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--brand);color:var(--brand-ink)}
.top .row{display:flex;align-items:center;gap:12px;min-height:56px}
.top .logo{height:24px;width:auto;display:block}
.top .app{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--green);padding-left:12px;border-left:1px solid rgba(245,239,230,.2);white-space:nowrap}
.top .sp{flex:1}
.mes{display:flex;align-items:center;gap:2px;background:rgba(245,239,230,.1);border-radius:999px;padding:3px}
.mes button{border:0;background:transparent;color:var(--brand-ink);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.mes button:hover{background:rgba(245,239,230,.12)}
.mes span{min-width:88px;text-align:center;font-weight:700;font-size:14px}
.top .search{padding-block:0 12px}
.sbox{position:relative}
.sbox input{width:100%;height:44px;border-radius:10px;border:1px solid transparent;background:rgba(245,239,230,.12);color:var(--brand-ink);padding:0 40px 0 42px;font-size:16px}
.sbox input::placeholder{color:rgba(245,239,230,.6)}
.sbox svg{position:absolute;left:14px;top:13px;stroke:var(--green)}
.top .sbox-wide{display:none;flex:1;max-width:460px}
.sbox .x{position:absolute;right:6px;top:6px;width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--brand-ink);font-size:18px}

/* ---------- navegación ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--nav-h);text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600}
.nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{color:var(--green-d)}
.nav a[aria-current="page"] svg{stroke-width:2.4}
.nav .nav-brand{display:none}
main{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}

/* ---------- comunes ---------- */
.page{padding-block:18px 8px;display:flex;flex-direction:column;gap:22px;max-width:1180px;margin:0 auto;width:100%}
.ph-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1.t{font-family:var(--f-d);font-weight:600;font-size:clamp(24px,5.6vw,32px);line-height:1.1;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
h2.s{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin:0;display:flex;align-items:center;gap:8px}
h2.s .c{font-weight:600;color:var(--faint);letter-spacing:0;text-transform:none;font-size:13px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.link{border:0;background:transparent;color:var(--green-d);font-weight:700;font-size:14px;padding:6px 0;text-decoration:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;height:38px;font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
a.chip{color:var(--ink);text-decoration:none}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{opacity:.6;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-best{background:var(--green);color:var(--on-green)}
.s-on{background:var(--green-soft);color:var(--green-d)}
.s-new{background:var(--warn-soft);color:var(--warn)}
.s-out{background:var(--tan-soft);color:var(--tan-d)}
.s-td{background:var(--tan-soft);color:var(--tan-d)}
.s-off{background:transparent;color:var(--faint);border:1px dashed var(--line)}
.s-blk{background:var(--bad-soft);color:var(--bad)}
.empty{padding:40px 12px;text-align:center;color:var(--muted)}

/* sprite de fotos */
.img{position:relative;background:#fff;overflow:hidden}
.spr{position:absolute;inset:0;background-repeat:no-repeat}
.noimg{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#8a7a6e;font-style:italic}

/* ---------- inicio ---------- */
.hello{background:var(--brand);color:var(--brand-ink);border-radius:var(--r);padding:20px;display:grid;gap:16px;position:relative;overflow:hidden}
.hello .eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--green)}
.hello h1{font-family:var(--f-d);font-weight:600;font-size:clamp(26px,6vw,36px);line-height:1.08;margin:4px 0 0;text-wrap:balance}
.hello p{margin:6px 0 0;color:rgba(245,239,230,.75);max-width:52ch}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{display:flex;flex-direction:column;gap:2px;text-align:left;background:rgba(245,239,230,.08);border:1px solid rgba(245,239,230,.12);border-radius:10px;padding:12px 14px;color:inherit}
.kpi:hover{background:rgba(245,239,230,.14)}
.kpi b{font-family:var(--f-d);font-size:28px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:rgba(245,239,230,.78)}
.kpi i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.rail>*{scroll-snap-align:start}
.secret{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;background:var(--tan-soft);border:1px solid var(--tan);border-radius:var(--r);padding:12px;text-align:left;width:100%}
.secret .img{width:84px;aspect-ratio:4/3;border-radius:8px}
.secret p{margin:4px 0 0;font-size:15px}
.secret .lbl{color:var(--tan-d)}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.catc{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:14px;font-weight:700;text-align:left}
.catc small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
.catc .n{font-family:var(--f-d);font-size:22px;color:var(--green-d);font-variant-numeric:tabular-nums}

/* ---------- tarjetas producto ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.card{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;padding:0;min-width:0;text-decoration:none;color:inherit;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:var(--shadow)}
.card .img{aspect-ratio:4/3;border-bottom:1px solid var(--line)}
.card .tx{padding:10px 11px 12px;display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.card .nm{font-family:var(--f-d);font-weight:600;font-size:15.5px;line-height:1.2;text-wrap:balance}
.card .mt{font-size:12px;color:var(--muted)}
.card .pill{margin-top:auto;align-self:flex-start}
.card .tx .pill{margin-top:6px}
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rowp{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 12px 8px 8px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;min-height:64px}
.rowp:last-child{border-bottom:0}
.rowp .img{width:64px;aspect-ratio:4/3;border-radius:6px}
.rowp .nm{font-weight:700;font-size:15px;line-height:1.2}
.rowp .mt{font-size:12.5px;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:7px;height:32px;padding:0 10px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.count{font-size:13px;color:var(--muted)}
.sel{height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px;font-size:13.5px;font-weight:600}

/* ---------- ficha ---------- */
.dhead{display:flex;align-items:center;gap:8px;justify-content:space-between}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--green-d);font-weight:700;height:40px;padding:0;text-decoration:none}
.pn{display:flex;gap:6px}
.pn a{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);font-size:18px}
.pn a[aria-disabled="true"]{opacity:.35;pointer-events:none}
.hero{display:grid;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.hero .img{border-radius:8px;aspect-ratio:4/3}
.hero .kick{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green-d)}
.hero .kick span{color:var(--tan-d)}
.hero h1{font-family:var(--f-d);font-weight:600;font-size:clamp(28px,7vw,40px);line-height:1.04;margin:6px 0 4px;letter-spacing:-.015em;color:var(--green-d);text-wrap:balance}
.hero .lat{font-style:italic;color:var(--muted);font-size:14px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.fact{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
.fact b{display:block;font-size:14px;line-height:1.25;margin-top:2px}
.anchors{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h));z-index:20;background:var(--bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.anchors a{text-decoration:none}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;scroll-margin-top:calc(var(--top-h) + 70px)}
.blk>h2.s{padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.blk>h2.s::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--green)}
.blk.t>h2.s::before{background:var(--tan)} .blk.d>h2.s::before{background:var(--ink)}
.temp{margin:0 0 12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.cal .m{font-size:10.5px;text-align:center;color:var(--faint);text-transform:uppercase;font-weight:700}
.cal .m.now{color:var(--ink)}
.cal .c{height:24px;border-radius:4px;border:1px dashed var(--line)}
.cal .c.on{background:var(--green-soft);border:0}
.cal .c.td{background:var(--tan-soft);border:1px solid var(--tan)}
.cal .c.best{background:var(--green);border:0}
.cal .c.now{box-shadow:0 0 0 2px var(--ink) inset}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.orig{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px}
.orig li{display:grid;grid-template-columns:78px 1fr;gap:10px;font-size:14px}
.orig li.now{font-weight:700}
.orig b{color:var(--green-d)}
.sens{display:grid;gap:12px}
.sens>div{background:var(--surface-2);border-radius:8px;padding:11px 13px}
.sens p{margin:3px 0 0;font-size:15.5px}
.usos{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.usos li{background:var(--green-soft);color:var(--green-d);border-radius:8px;padding:7px 11px;font-size:14px;font-weight:600}
.tip{background:var(--green);color:var(--on-green);border-radius:var(--r);padding:16px;display:grid;gap:4px}
.tip .lbl{color:var(--on-green);opacity:.75}
.tip p{margin:0;font-size:16.5px;font-weight:650}
.sec2{background:var(--tan-soft);border:1px solid var(--tan);border-radius:var(--r);padding:16px;display:grid;gap:4px}
.sec2 .lbl{color:var(--tan-d)}
.sec2 p{margin:0;font-size:16px}
.evo{margin:0 0 14px;color:var(--muted);font-style:italic}
.states{display:grid;gap:10px}
.st{display:grid;grid-template-columns:120px 1fr;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;position:relative}
.st::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:5px;border-radius:10px 0 0 10px;background:var(--green)}
.st.u::before{background:var(--tan)} .st.x::before{background:var(--bad)}
.st .img{width:120px;aspect-ratio:4/3;border-radius:6px;align-self:start}
.st .lb{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.st.a .lb{color:var(--green-d)} .st.u .lb{color:var(--tan-d)} .st.x .lb{color:var(--bad)}
.st .ac{display:inline-block;font-size:11.5px;font-weight:700;margin:3px 0 4px;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.st p{margin:0;font-size:14px}
.gen{font-size:12px;color:var(--faint);margin-top:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.kv dt{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.kv dd{margin:0}
.alg{display:grid;gap:6px}
.alg .lg{display:inline-flex;align-items:center;gap:8px;font-weight:800}
.alg .lg.no{color:var(--green-d)} .alg .lg.si{color:var(--bad)}
.alg p{margin:0;font-size:14px;color:var(--muted)}
.foot{color:var(--faint);font-size:12px;text-align:center;padding-block:8px 0}

/* ---------- calendario ---------- */
.ctab{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.crow{display:grid;grid-template-columns:minmax(110px,34%) repeat(12,minmax(0,1fr));align-items:center;gap:2px;padding:5px 8px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;min-height:38px}
.crow:hover{background:var(--surface-2)}
.crow .nm{font-size:13px;font-weight:600;line-height:1.2;padding-right:6px;overflow:hidden;text-overflow:ellipsis}
.crow .c{height:18px;border-radius:3px}
.crow .c.on{background:var(--green-soft)} .crow .c.best{background:var(--green)} .crow .c.td{background:var(--tan-soft);box-shadow:inset 0 0 0 1px var(--tan)}
.crow .c.now{box-shadow:inset 0 0 0 2px var(--ink)}
.chead{background:var(--surface-2);font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;min-height:30px}
.chead span{text-align:center}
.chead span.now{color:var(--ink)}
.cgroup{padding:10px 12px 6px;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green-d);background:var(--surface);border-bottom:1px solid var(--line)}

/* ---------- revisión ---------- */
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .25s}
.rv{display:grid;grid-template-columns:44px 64px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px 10px 6px;border-bottom:1px solid var(--line)}
.rv:last-child{border-bottom:0}
.rv.ok{background:var(--surface-2)}
.rv.ok .rtx{opacity:.55}
.chk{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center}
.chk span{width:26px;height:26px;border-radius:7px;border:2px solid var(--faint);display:grid;place-items:center;color:transparent;font-weight:900}
.rv.ok .chk span{background:var(--green);border-color:var(--green);color:var(--on-green)}
.rv .img{width:64px;aspect-ratio:4/3;border-radius:6px}

/* ---- merma ---- */

.mdet{grid-column:1/-1;display:grid;gap:8px;padding:6px 0 4px}
.mfoto img{max-width:100%;max-height:320px;border-radius:8px}
.minp{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:var(--surface-2);color:var(--ink);font-family:inherit}
.mbars{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
.mbar{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s);padding:12px;display:grid;gap:7px;align-content:start}
.mbar .br{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr auto;gap:8px;align-items:center;font-size:13px}
.mbar .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbar .bt{height:8px;border-radius:4px;background:var(--line);overflow:hidden} .mbar .bt i{display:block;height:100%;background:var(--tan)}
.mbar .bv{color:var(--muted);white-space:nowrap}
.msheet-bg{position:fixed;inset:0;z-index:70;background:rgba(30,24,20,.55);display:flex;align-items:flex-end;justify-content:center}

@media (prefers-reduced-motion:no-preference){ .sbox .mic.on{animation:pulse 1.2s ease-in-out infinite} @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(163,65,47,.25)}} }
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
/* ---- cámara y lineal ---- */

  <a href="#catalogo" data-v="catalogo"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Catálogo</a>

<main class="gut" id="main" tabindex="-1"><div class="page"><div class="empty">Cargando el manual…</div></div></main>

<script>
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const slug=s=>s.normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('campo2-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('campo2-'+k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
const pad=(n,l)=>String(n).padStart(l,'0');
let DATA=[], BYID={};
const S={mes:new Date().getMonth(),q:'',cat:LS.get('cat','Todas'),sub:'Todas',est:'todos',vista:LS.get('vista','grid'),orden:'manual',calCat:LS.get('calCat','Fruta'),revCat:'Todas',revSolo:false,uso:'todos',ca:'',cb:''};

/* ---- lógica de temporada ---- */
const mm=m=>(m+12)%12;
function enTienda(p,m){ m=mm(m); if(p.td&&p.td.length) return p.td.includes(m); return p.venta.some(([a,b,t,s])=>s!=='n'&&m>=a&&m<b); }
const todoAnio=p=>[...Array(12).keys()].every(m=>enTienda(p,m));
const best=(p,m)=>(p.pico||[]).includes(mm(m))&&enTienda(p,m);
const entra=(p,m)=>enTienda(p,m)&&!enTienda(p,m-1)&&!todoAnio(p);
const sale=(p,m)=>enTienda(p,m)&&!enTienda(p,m+1)&&!todoAnio(p);
const finde=p=>p.td&&p.td.length;
function estado(p,m){
  if(!p.venta.length&&!finde(p)) return ['s-blk','Bloqueada'];
  if(!enTienda(p,m)) return ['s-off','No se trabaja'];
  if(best(p,m)) return ['s-best','Mejor momento'];
  if(entra(p,m)) return ['s-new','Entra este mes'];
  if(sale(p,m)) return ['s-out','Último mes'];
  if(finde(p)) return ['s-td','Fin de semana'];
  return ['s-on','En tienda'];
}
function origenMes(p,m){ const o=p.origen.find(([a,b,t,s])=>s!=='n'&&m>=a&&m<b); return o?o[2]:null; }

/* ---- fotos (hojas JPEG) ---- */
function TH(p){ if(!p.foto) return '<span class="noimg">Foto pendiente</span>'; const [s,c,r]=p.th;
  return `<div class="spr" role="img" aria-label="${esc(p.ref)}" style="background-image:url(t-${pad(s,2)}.jpg);background-size:600% 500%;background-position:${c*20}% ${r*25}%"></div>`; }
function DT(p,c,alt){ const [s,r]=p.dt;
  return `<div class="spr" role="img" aria-label="${esc(alt)}" style="background-image:url(d-${pad(s,3)}.jpg);background-size:400% 400%;background-position:${c*100/3}% ${r*100/3}%"></div>`; }

/* ---- componentes ---- */
function card(p){ const [c,t]=estado(p,S.mes);
  return `<a class="card" href="#p-${p.id}"><div class="img">${TH(p)}</div><div class="tx"><span class="nm">${esc(p.ref)}</span><span class="mt">${esc(p.sub)}${p.fmt?' · '+esc(p.fmt):''}</span><span class="pill ${c}">${t}</span></div></a>`; }
function rowp(p,extra){ const [c,t]=estado(p,S.mes);
  return `<a class="rowp" href="#p-${p.id}"><div class="img">${TH(p)}</div><div><div class="nm">${esc(p.ref)}</div><div class="mt">${esc(p.sub)}${p.fmt?' · '+esc(p.fmt):''}${extra?' · '+extra:''}</div></div><span class="pill ${c}">${t}</span></a>`; }
const chipsHTML=(list,cur,attr)=>list.map(([v,l,n])=>`<button class="chip" ${attr}="${esc(v)}" aria-pressed="${cur===v}">${esc(l)}${n!=null?`<span class="n num">${n}</span>`:''}</button>`).join('');

/* ---- INICIO ---- */
function vInicio(){
  const m=S.mes, on=DATA.filter(p=>enTienda(p,m)), b=on.filter(p=>best(p,m)), n=on.filter(p=>entra(p,m)), o=on.filter(p=>sale(p,m)), f=on.filter(finde);
  const doy=Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/864e5);
  const sec=DATA.filter(p=>p.pepita&&enTienda(p,m)); const sp=sec.length?sec[doy%sec.length]:DATA[0];
  const cats=[...new Set(DATA.map(p=>p.cat))];
  const kpi=(v,l,col,est)=>`<button class="kpi" data-go="${est}"><b>${v}</b><span><i style="background:${col}"></i>${l}</span></button>`;
  const rail=(L,empty)=>L.length?`<div class="rail">${L.map(card).join('')}</div>`:`<div class="count">${empty}</div>`;
  return `<section class="hello">
    <div><div class="eyebrow">${MESES[m]} · surtido de campo</div><h1>Qué hay en tienda este mes</h1><p>Temporada, calidad y cómo recomendar cada producto. Cambia el mes arriba para preparar el siguiente.</p></div>
    <div class="kpis">${kpi(on.length,'En tienda','var(--green-soft)','tienda')}${kpi(b.length,'Mejor momento','var(--green)','mejor')}${kpi(n.length,'Entran este mes','var(--warn)','entra')}${kpi(o.length,'Último mes','var(--tan)','sale')}</div>
  </section>
  <button class="secret" data-href="#p-${sp.id}"><div class="img">${TH(sp)}</div><div><div class="lbl">Secreto de la huerta del día · ${esc(sp.ref)}</div><p>${esc(sp.pepita)}</p></div></button>
  <section><div class="sec-h"><h2 class="s">En su mejor momento <span class="c num">${b.length}</span></h2><button class="link" data-go="mejor">Ver todos</button></div>${rail(b,'Ningún producto en su mejor momento este mes.')}</section>
  <section><div class="sec-h"><h2 class="s">Entran este mes <span class="c num">${n.length}</span></h2><button class="link" data-go="entra">Ver todos</button></div>${rail(n,'No entra ninguna referencia nueva este mes.')}</section>
  <section><div class="sec-h"><h2 class="s">Último mes en tienda <span class="c num">${o.length}</span></h2><button class="link" data-go="sale">Ver todos</button></div>${rail(o,'Ninguna referencia se despide este mes.')}</section>
  ${f.length?`<section><div class="sec-h"><h2 class="s">Fines de semana <span class="c num">${f.length}</span></h2><button class="link" data-go="finde">Ver todos</button></div>${rail(f,'')}</section>`:''}
  <section><div class="sec-h"><h2 class="s">Para el cliente</h2></div><div class="uso-grid">${USOS.filter(u=>u[0]!=='todos').map(([v,l,d])=>`<button class="uso" data-uso="${v}"><span>${l}<small>${d}</small></span><span class="n num">${DATA.filter(p=>p.tags.includes(v)&&enTienda(p,m)).length}</span></button>`).join('')}</div></section>
  <section><div class="sec-h"><h2 class="s">Categorías</h2></div><div class="cats">${cats.map(c=>{const L=DATA.filter(p=>p.cat===c);return `<button class="catc" data-cat="${esc(c)}"><span>${esc(c)}<small>${L.filter(p=>enTienda(p,m)).length} en tienda en ${MC[m]}</small></span><span class="n">${L.length}</span></button>`}).join('')}</div></section>
  <div class="foot">Cosas Buenas S.L. · Manual de campo · Documento interno</div>`;
}

/* ---- CATÁLOGO ---- */
const USOS=[['todos','Todos los usos',''],['sinal','Sin alérgenos','Ni UE ni cruzados'],['zumo','Zumos y batidos','Para exprimir, licuar o batir'],['ninos','Para niños','Fáciles de comer y dulces'],['horno','Para horno','Asados, gratinados y repostería'],['coctel','Para cócteles','Coctelería, bebidas y decoración']];
const ESTF=[['todos','Todos'],['tienda','En tienda'],['mejor','Mejor momento'],['entra','Entran'],['sale','Último mes'],['finde','Fin de semana']];
/* ---- BUSCADOR TOLERANTE A ERRORES ----
   Normaliza tildes y sonidos que se confunden al escribir (b/v, ll/y, c/z/s, qu/k, g/j, h muda, letras dobles)
   y acepta 1 error en palabras de 4-5 letras y 2 en las de 6 o más (al menos ~65 % de la palabra correcta).
   Con 3 palabras o más basta con que encajen 2 de cada 3. */
const STOP=new Set('de del la las el los un una y o con sin en para por al a que mi'.split(' '));
const fon=w=>w.replace(/^hi([aeo])/,'y$1').replace(/^hu([aeio])/,'gu$1').replace(/ch/g,'#').replace(/h/g,'').replace(/#/g,'ch').replace(/v/g,'b').replace(/ll/g,'y').replace(/qu/g,'k').replace(/c([ei])/g,'s$1').replace(/z/g,'s').replace(/c/g,'k').replace(/g([ei])/g,'j$1').replace(/w/g,'u').replace(/(.)\1+/g,'$1');
const palabras=t=>slug(t).split('-').filter(w=>w&&!STOP.has(w));
function dist(a,b,max){ // Damerau-Levenshtein (transposiciones = 1), con corte
  const la=a.length,lb=b.length; if(Math.abs(la-lb)>max) return max+1;
  let p2=null,p1=Array.from({length:lb+1},(_,j)=>j);
  for(let i=1;i<=la;i++){ const c=[i]; let mn=i;
    for(let j=1;j<=lb;j++){ const k=a[i-1]===b[j-1]?0:1; let v=Math.min(p1[j]+1,c[j-1]+1,p1[j-1]+k);
      if(p2&&i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) v=Math.min(v,p2[j-2]+1); c[j]=v; if(v<mn) mn=v; }
    if(mn>max) return max+1; p2=p1; p1=c; }
  return p1[lb];
}
function puntua(w,lista,fuzzy){ // 1 exacta · 0.9 empieza por · 0.8-0.6 aproximada · 0 nada
  const L=w.length, maxd=!fuzzy||L<=3||/\d/.test(w)?0:L<=5?1:2; let best=0;
  for(const c of lista){
    if(c===w) return 1;
    if(c.startsWith(w)){ best=Math.max(best,0.9); continue; }
    if(!maxd) continue;
    let d=dist(w,c,maxd); if(c.length>L) d=Math.min(d,dist(w,c.slice(0,L),maxd));
    if(d<=maxd&&1-d/L>=0.65) best=Math.max(best,0.8-0.1*d);
  }
  return best;
}
let VOC=[]; // vocabulario del surtido: si una palabra existe tal cual, no se corrige
const conocida=w=>VOC.some(c=>c.startsWith(w));
function relevancia(p,qw,frase,fz){
  let ok=0,sc=0;
  for(const w of qw){ const f=fz[w];
    const a=puntua(w,p._ref,f), m=puntua(w,p._m,f)*0.75, b=puntua(w,p._r,f&&w.length>=5)*0.6, v=Math.max(a,m,b>0.48?b:0); if(v>0){ok++;sc+=v;} }
  const need=qw.length<=2?qw.length:Math.ceil(qw.length*0.66);
  if(ok<need) return 0;
  if(frase&&p._s.includes(frase)) sc+=1.5;
  if(p._s0.startsWith(frase)) sc+=1;
  return sc;
}
function filtrar(){
  const frase=slug(S.q).replace(/-/g,' ').trim(), m=S.mes, qw=[...new Set(palabras(S.q).map(fon))];
  const fe={todos:()=>true,tienda:p=>enTienda(p,m),mejor:p=>best(p,m),entra:p=>entra(p,m),sale:p=>sale(p,m),finde:p=>finde(p)&&enTienda(p,m)}[S.est];
  let L=DATA.filter(p=>(S.cat==='Todas'||p.cat===S.cat)&&(S.sub==='Todas'||p.sub===S.sub)&&fe(p)&&(S.uso==='todos'||p.tags.includes(S.uso)));
  S.aprox=false;
  if(frase){
    if(!qw.length) L=L.filter(p=>p._s.includes(frase));
    else { const fz={}; qw.forEach(w=>fz[w]=!conocida(w)); L=L.map(p=>[p,relevancia(p,qw,frase,fz)]).filter(x=>x[1]>0);
      S.aprox=L.length>0&&Object.values(fz).some(Boolean);
      if(S.orden!=='az') L.sort((a,b)=>b[1]-a[1]); L=L.map(x=>x[0]); }
  }
  if(S.orden==='az') L=[...L].sort((a,b)=>a.ref.localeCompare(b.ref,'es'));
  return L;
}

/* ---- CÁMARA Y LINEAL ---- */
const NEV={si:['Cámara fría','2–5 °C, en cámara o mural refrigerado'],no:['Fuera de la cámara fría','Zona fresca o ambiente: el frío lo daña'],seco:['Ambiente seco','Seco y ventilado, nunca en cámara']};
const LV={alto:'Alto',medio:'Medio','':'Bajo'};
const lvl=v=>`<span class="lvl ${v||'bajo'}"><i></i>${LV[v||'']}</span>`;
function familias(f){ const m=new Map(); DATA.filter(f).forEach(p=>m.set(p.cam.fam,(m.get(p.cam.fam)||0)+1)); return [...m.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0]); }
const famBtns=(L,max)=>`<div class="famlist">${L.slice(0,max||99).map(f=>`<button class="fam" data-fam="${esc(f)}">${esc(f)}</button>`).join('')}${max&&L.length>max?`<a class="fam" href="#camara">y ${L.length-max} más</a>`:''}</div>`;
function camHTML(p){

  return `<section class="blk t" id="s-cam"><h2 class="s">Cámara y lineal</h2>
    <div class="camf"><div class="fact"><span class="lbl">Suelta etileno</span><b>${lvl(c.et)}</b></div><div class="fact"><span class="lbl">Sensible al etileno</span><b>${lvl(c.sen)}</b></div><div class="fact"><span class="lbl">Dónde va</span><b>${n[0]}</b><span class="count">${n[1]}</span></div></div>
    <p class="why">${why.map(esc).join(' ')}</p>
    ${lejos.length?`<div class="lbl" style="margin-top:12px">No colocar junto a</div>${famBtns(lejos,12)}`:''}
    ${prod.length?`<div class="lbl" style="margin-top:12px">Alejar de</div>${famBtns(prod,12)}`:''}
    <p class="why"><a href="#camara" style="color:var(--green-d);font-weight:700">Comprobar con otro producto ›</a></p></section>`;
}
function buscarUno(q){ if(!q) return null; const ex=DATA.find(p=>p.ref.toLowerCase()===q.trim().toLowerCase()); if(ex) return ex;
  const frase=slug(q).replace(/-/g,' ').trim(), qw=[...new Set(palabras(q).map(fon))]; if(!qw.length) return null;
  const fz={}; qw.forEach(w=>fz[w]=!conocida(w));
  let best=null,bs=0; DATA.forEach(p=>{ const r=relevancia(p,qw,frase,fz); if(r>bs){bs=r;best=p;} }); return best; }
function compat(a,b){
  const out=[]; let peor=0; const add=(n,t)=>{out.push(t); peor=Math.max(peor,n);};
  if(a.id===b.id) return {peor:0,out:['Es el mismo producto.']};
  const pat=x=>x.cam.fam==='Patata', ceb=x=>/^(Cebolla|Ajo|Chalota)/.test(x.cam.fam);
  if((pat(a)&&ceb(b))||(pat(b)&&ceb(a))) add(2,'La cebolla y el ajo hacen brotar antes la patata, y la patata les pasa humedad: guardarlas separadas.');
  for(const [x,y] of [[a,b],[b,a]]){
    if(!x.cam.et||!y.cam.sen||x.cam.fam===y.cam.fam) continue;
    if(x.cam.et==='medio'&&y.cam.sen==='medio') continue;
    add(x.cam.et==='alto'&&y.cam.sen==='alto'?2:1, `${x.ref} suelta etileno y ${y.ref} es sensible: ${y.cam.efe}.`);
  }
  const fa=a.cam.nev==='si', fb=b.cam.nev==='si';
  if(fa!==fb){ const [f,o]=fa?[a,b]:[b,a]; add(1,`No comparten temperatura: ${f.ref} va en cámara fría (2–5 °C) y ${o.ref} fuera de ella (${NEV[o.cam.nev][1].toLowerCase()}).`); }
  else if(a.cam.nev!==b.cam.nev) add(1,`${a.cam.nev==='seco'?a.ref:b.ref} necesita ambiente seco y ventilado; ${a.cam.nev==='seco'?b.ref:a.ref} prefiere zona fresca.`);
  return {peor,out};
}

/* ---- BÚSQUEDA POR VOZ ---- */
let toastT; function toast(t){ let el=$('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el); } el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,3500); }
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let REC=null;
function dictar(btn,target){
  if(REC){ try{REC.stop()}catch(e){} return; }
  const inp=target||btn.parentNode.querySelector('input');
  let r; try{ r=new SR(); }catch(e){ toast('Este navegador no permite buscar por voz.'); return; }
  REC=r; r.lang='es-ES'; r.interimResults=true; r.maxAlternatives=1; r.continuous=false;
  btn.classList.add('on'); btn.setAttribute('aria-label','Escuchando… toca para parar');
  r.onresult=e=>{ const t=[...e.results].map(x=>x[0].transcript).join(' ').replace(/[.¿?¡!]/g,'').trim(); inp.value=t; inp.dispatchEvent(new Event('input',{bubbles:true})); };
  r.onerror=e=>{ const m={'not-allowed':'Permite el micrófono para buscar por voz. En la app instalada desde GitHub funciona en Android y PDA con Chrome.','service-not-allowed':'Permite el micrófono para buscar por voz. En la app instalada desde GitHub funciona en Android y PDA con Chrome.','no-speech':'No te he oído. Toca el micrófono y di el producto.','network':'La búsqueda por voz necesita conexión a internet.','audio-capture':'No encuentro micrófono en este dispositivo.'}; if(e.error!=='aborted') toast(m[e.error]||'No se ha podido usar la voz. Prueba otra vez.'); };
  r.onend=()=>{ REC=null; btn.classList.remove('on'); btn.setAttribute('aria-label','Buscar por voz'); };
  try{ r.start(); }catch(e){ REC=null; btn.classList.remove('on'); }
}
if(SR){ document.querySelectorAll('.sbox .mic').forEach(b=>{ b.hidden=false; b.addEventListener('click',()=>dictar(b)); }); }

const TIENDAS=['Valdemarín','Ayala','Coello','Viriato'];
const MOTIVOS=['Inasumible (moho o podrido)','Golpe o daño','Última vida sin vender','Daño por frío','Exceso de pedido','Envase roto','Devolución de cliente','Otro'];
const DESTINOS=['Basura','Obrador / transformación','Donación','Compost'];
const UNIDADES=[['kg','kg'],['uds','unidades'],['env','envases']];
const M={cfg:null,cfgOk:false,hoy:[],resp:null,rq:{rango:'hoy',tienda:'Todas',motivo:'',estado:'',desde:'',hasta:''},regs:[],ult:null,err:'',cargando:false,abierto:null,fotos:{}};
const SS={get(k){try{return sessionStorage.getItem('campo2-'+k)}catch(e){return null}},set(k,v){try{v==null?sessionStorage.removeItem('campo2-'+k):sessionStorage.setItem('campo2-'+k,v)}catch(e){}}};
const mDisp=()=>{ let d=LS.get('merma-disp',''); if(!d){ d=Math.random().toString(36).slice(2,8); LS.set('merma-disp',d); } return d; };
const mTienda=()=>LS.get('merma-tienda',''), mNombre=()=>LS.get('merma-nombre','');
const mCola=()=>LS.get('merma-cola',[]);
function setCola(c){ try{ localStorage.setItem('campo2-merma-cola',JSON.stringify(c)); return true; }catch(e){ return false; } }
const isoLocal=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,19);
const fechaLocal=d=>isoLocal(d).slice(0,10);
const unidadPorDefecto=p=>/granel/i.test(p.fmt)?'kg':/unidad|pieza|manojo|ud\b/i.test(p.fmt)?'uds':'env';
const UNL=u=>({kg:'kg',uds:'uds',env:'envases'}[u]||u);
const fmtN=n=>(Math.round(n*100)/100).toLocaleString('es-ES');

async function mConfig(){
  if(M.cfg) return M.cfg;
  try{ const r=await fetch('merma-config.json',{cache:'no-store'}); const c=await r.json(); M.cfg=c; M.cfgOk=!!(c&&c.url&&c.clave); }
  catch(e){ M.cfg={}; M.cfgOk=false; }
  return M.cfg;
}
async function api(a,datos){
  const c=await mConfig(); if(!M.cfgOk) throw new Error('sin_config');
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),25000);
  try{
    const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({k:c.clave,a},datos||{})),signal:ctl.signal,redirect:'follow'});
    const j=await r.json(); if(!j.ok) { const e=new Error(j.error||'error'); e.code=j.error; throw e; } return j;
  } finally { clearTimeout(to); }
}

/* cola: lo registrado se guarda primero en el dispositivo y se envía cuando hay conexión */
let enviando=false;
async function enviarCola(){
  if(enviando) return; const cola=mCola(); if(!cola.length) return;
  if(!(await mConfig(), M.cfgOk)) return;
  enviando=true;
  try{
    while(true){
      const c=mCola(); if(!c.length) break;
      const lote=[]; let peso=0; for(const r of c){ const w=(r.foto||'').length+800; if(lote.length&&(peso+w>1500000||lote.length>=15)) break; lote.push(r); peso+=w; }
      const j=await api('add',{registros:lote});
      const ok=new Set([...(j.ids||[]),...(j.rechazados||[])]);
      if(j.rechazados&&j.rechazados.length) toast('Algún registro tenía datos no válidos y no se ha guardado.');
      setCola(mCola().filter(r=>!ok.has(r.id)));
      if(!ok.size) break;
    }
    M.err='';
  }catch(e){ M.err=e.code==='clave'?'clave':'red'; }
  finally{ enviando=false; }
  await mRefrescar(true);
}

async function mRefrescar(silencioso){
  if(!M.cfgOk||!mTienda()) { if(VIEW==='merma'&&!silencioso) pintarMerma(); return; }
  M.cargando=true;
  try{
    const j=await api('list',{tienda:mTienda()}); M.hoy=j.registros||[]; M.ult=new Date(); M.err='';
    if(M.resp){ const q=rangoFechas(); const k=await api('list',{pin:M.resp.pin,tienda:M.rq.tienda,desde:q[0],hasta:q[1]}); M.regs=k.registros||[]; M.total=k.total; }
  }catch(e){ if(e.code==='pin'){ salirResp(); toast('El PIN ya no es válido.'); } else M.err=e.code==='clave'?'clave':'red'; }
  M.cargando=false;
  if(VIEW==='merma') pintarMerma();
}
function rangoFechas(){
  const d=new Date(), h=fechaLocal(d), dd=n=>fechaLocal(new Date(d.getTime()-n*864e5));
  return {hoy:[h,h],ayer:[dd(1),dd(1)],'7d':[dd(6),h],'30d':[dd(29),h],otro:[M.rq.desde||h,M.rq.hasta||h]}[M.rq.rango];
}
function salirResp(){ M.resp=null; M.regs=[]; SS.set('merma-pin',null); SS.set('merma-alc',null); }

    </div>`:''}

function totales(L){ const t={n:L.length,kg:0,uds:0,env:0}; L.forEach(r=>{ const u=r.unidad; if(t[u]!=null) t[u]+=Number(r.cantidad)||0; }); return t; }
function kpisM(t,extra){ return `<div class="mk"><div><b class="num">${t.n}</b><span>registros</span></div><div><b class="num">${fmtN(t.kg)}</b><span>kg</span></div><div><b class="num">${fmtN(t.uds)}</b><span>unidades</span></div><div><b class="num">${fmtN(t.env)}</b><span>envases</span></div>${extra||''}</div>`; }
function barras(titulo,L,key){
  const m=new Map(); L.forEach(r=>{ const k=r[key]||'—'; const o=m.get(k)||{n:0,kg:0}; o.n++; if(r.unidad==='kg') o.kg+=Number(r.cantidad)||0; m.set(k,o); });
  const arr=[...m.entries()].sort((a,b)=>b[1].n-a[1].n).slice(0,10); const mx=Math.max(1,...arr.map(x=>x[1].n));
  return `<div class="mbar"><div class="lbl">${titulo}</div>${arr.length?arr.map(([k,o])=>`<div class="br"><span class="bn">${esc(k)}</span><span class="bt"><i style="width:${Math.round(o.n/mx*100)}%"></i></span><span class="bv num">${o.n}${o.kg?' · '+fmtN(o.kg)+' kg':''}</span></div>`).join(''):'<div class="count">Sin datos</div>'}</div>`;
}
function mermaInner(){
  if(!M.cfg) return '<div class="empty">Cargando…</div>';
  if(!M.cfgOk) return `<div class="blk"><h2 class="s">Merma no configurada</h2><p>Esta versión de la app no está conectada a la hoja de merma. El registro funciona en la app instalada desde GitHub, una vez configurada con la guía de montaje.</p></div>`;
  const t=mTienda(), nom=mNombre();
  if(!t||!nom) return `<div class="blk"><h2 class="s">Este dispositivo</h2><p class="count">Solo se pide una vez. Se puede cambiar cuando quieras.</p>
    <div class="lbl" style="margin-top:12px">Tienda</div><div class="chips" style="flex-wrap:wrap">${TIENDAS.map(x=>`<button class="chip" data-mt="${x}" aria-pressed="${(M.tSel||t)===x}">${x}</button>`).join('')}</div>

    <div style="margin-top:12px"><button class="btn p" id="mGuardarDisp">Guardar</button></div></div>`;
  const cola=mCola().filter(r=>r.tienda===t), ids=new Set(M.hoy.map(r=>r.id));
  const pend=cola.filter(r=>!ids.has(r.id));
  const sinc=M.err==='clave'?'<span style="color:var(--bad)">La clave de la app no coincide con la de la hoja. Revisa merma-config.json.</span>':M.err==='red'?`<span style="color:var(--warn)">Sin conexión con la hoja${pend.length?` · ${pend.length} sin enviar`:''}.</span> <button class="link" id="mRetry">Reintentar</button>`:M.ult?`Sincronizado a las ${pad(M.ult.getHours(),2)}:${pad(M.ult.getMinutes(),2)}:${pad(M.ult.getSeconds(),2)}${pend.length?` · ${pend.length} enviándose`:''}`:'Conectando…';
  const hoyT=totales([...pend,...M.hoy]);
  let html=`<div class="mtop"><button class="btn p mbig" data-mnew="">+ Registrar merma</button><div class="count">${esc(t)} · ${esc(nom)} · <button class="link" id="mCambiar">cambiar</button></div><div class="count">${sinc}</div></div>
  <section><div class="sec-h"><h2 class="s">Hoy en ${esc(t)} <span class="c num">${hoyT.n}</span></h2></div>${kpisM(hoyT)}
  ${hoyT.n?`<div class="rows" style="margin-top:10px">${pend.map(r=>filaMerma(r,false,true)).join('')}${M.hoy.map(r=>filaMerma(r,false,false)).join('')}</div>`:'<div class="count" style="margin-top:8px">Todavía no hay merma registrada hoy en esta tienda.</div>'}</section>`;
  if(!M.resp) return html+`<section class="blk"><h2 class="s">Responsable</h2><p class="count">Con tu PIN ves el histórico, los motivos y validas cada registro.</p><div style="display:flex;gap:8px;margin-top:10px"><input class="minp" id="mPin" type="password" inputmode="numeric" placeholder="PIN" maxlength="8" style="max-width:160px"><button class="btn p" id="mEntrar">Entrar</button></div></section>`;
  const q=M.rq; let L=M.regs.filter(r=>(!q.motivo||r.motivo===q.motivo)&&(!q.estado||(r.estado||'Pendiente')===q.estado));
  const pv=M.regs.filter(r=>(r.estado||'Pendiente')==='Pendiente').length;
  const tiendasR=M.resp.central?['Todas',...TIENDAS]:M.resp.tiendas;
  html+=`<section class="blk mresp"><div class="sec-h"><h2 class="s">Responsable · ${M.resp.central?'todas las tiendas':esc(M.resp.tiendas[0])}</h2><button class="link" id="mSalir">Salir</button></div>
    <div class="chips">${chipsHTML([['hoy','Hoy'],['ayer','Ayer'],['7d','7 días'],['30d','30 días'],['otro','Fechas']].map(([v,l])=>[v,l,null]),q.rango,'data-mrg')}</div>
    ${q.rango==='otro'?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><input class="minp" type="date" id="mDesde" value="${esc(q.desde)}" style="max-width:180px"><input class="minp" type="date" id="mHasta" value="${esc(q.hasta)}" style="max-width:180px"><button class="btn" id="mAplicar">Aplicar</button></div>`:''}
    ${tiendasR.length>1?`<div class="chips" style="margin-top:8px">${chipsHTML(tiendasR.map(x=>[x,x,null]),q.tienda,'data-mtr')}</div>`:''}
    <div class="chips" style="margin-top:8px">${chipsHTML([['','Todos los estados'],['Pendiente','Pendientes'],['Validado','Validados'],['Rechazado','Rechazados']].map(([v,l])=>[v,l,null]),q.estado,'data-mes')}</div>
    <div style="margin-top:8px"><select class="sel" id="mMotivo"><option value="">Todos los motivos</option>${MOTIVOS.map(x=>`<option ${q.motivo===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
    <div style="margin-top:12px">${kpisM(totales(L),`<div><b class="num">${pv}</b><span>por validar</span></div>`)}</div>

    <div class="mbars">${barras('Por motivo',L,'motivo')}${barras('Productos que más se tiran',L,'producto')}${M.resp.central&&q.tienda==='Todas'?barras('Por tienda',L,'tienda'):barras('Por persona',L,'empleado')}</div>

}

  <div class="lbl">Destino</div><div class="mopts">${DESTINOS.map(x=>`<button class="chip" data-mfd="${esc(x)}" aria-pressed="${MF.destino===x}">${esc(x)}</button>`).join('')}</div>
  <div class="lbl">Foto (opcional)</div>
  <div style="display:flex;gap:10px;align-items:center"><label class="btn" style="display:inline-flex;align-items:center">${MF.foto?'Cambiar foto':'Hacer foto'}<input type="file" id="mfFoto" accept="image/*" capture="environment" hidden></label>${MF.foto?`<img src="${MF.foto}" alt="" style="height:56px;border-radius:8px"><button class="link" id="mfSinFoto">Quitar</button>`:''}</div>
  <div class="lbl">Comentario ${MF.motivo==='Otro'?'(obligatorio)':'(opcional)'}</div><textarea class="minp" id="mfCom" rows="2" maxlength="500" placeholder="Ej.: llegó golpeado en el pedido de hoy">${esc(MF.com)}</textarea>
  <div id="mfErr" class="count" style="color:var(--bad)"></div>
  <button class="btn p mbig" id="mfOk">Guardar merma</button>`;
}
function repintarForm(){ const s=document.querySelector('.msheet'); if(!s) return; const y=s.scrollTop; leerForm(); s.innerHTML=formInner(); s.scrollTop=y; }
function leerForm(){ if(!MF) return; const c=$('mfCant'), m=$('mfCom'); if(c) MF.cant=c.value; if(m) MF.com=m.value; }
async function comprimir(file){
  const url=URL.createObjectURL(file);
  try{ const img=await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=url; });
    const k=Math.min(1,1024/Math.max(img.width,img.height)), cv=document.createElement('canvas'); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); return cv.toDataURL('image/jpeg',0.7);
  } finally { URL.revokeObjectURL(url); }
}
function guardarMerma(){
  leerForm(); const e=$('mfErr'), cant=Number(String(MF.cant).replace(',','.'));
  if(!MF.p){ e.textContent='Elige el producto.'; return; }
  if(!(cant>0)){ e.textContent='Indica la cantidad.'; return; }
  if(MF.uni==='kg'&&cant>500||MF.uni!=='kg'&&cant>2000){ e.textContent='La cantidad parece demasiado alta. Revísala.'; return; }
  if(!MF.motivo){ e.textContent='Elige el motivo.'; return; }
  if(MF.motivo==='Otro'&&!MF.com.trim()){ e.textContent='Explica el motivo en el comentario.'; return; }
  const p=MF.p, d=new Date();
  const r={id:mDisp()+'-'+d.getTime().toString(36)+Math.random().toString(36).slice(2,5),fecha_hora:isoLocal(d),fecha:fechaLocal(d),tienda:mTienda(),empleado:mNombre(),
    producto_id:p.id,producto:p.ref,categoria:p.cat,subcategoria:p.sub,formato:p.fmt,cantidad:cant,unidad:MF.uni,motivo:MF.motivo,destino:MF.destino,comentario:MF.com.trim(),foto:MF.foto,dispositivo:mDisp(),estado:'Pendiente'};
  const cola=mCola(); cola.push(r);
  if(!setCola(cola)){ r.foto=''; cola[cola.length-1]=r; if(!setCola(cola)){ e.textContent='No queda espacio en el dispositivo. Conéctate para enviar lo pendiente.'; return; } toast('Sin espacio para la foto: se guarda sin ella.'); }
  cerrarForm(); toast(navigator.onLine===false?'Merma guardada. Se enviará sola al volver la conexión.':'Merma registrada.');
  if(VIEW==='merma') pintarMerma();
  enviarCola();
}
document.addEventListener('click',async e=>{
  const bg=$('mformBg'); if(!bg||bg.hidden||!MF) return;
  if(e.target===bg){ cerrarForm(); return; }
  const t=e.target.closest('button,label'); if(!t||!bg.contains(t)) return;
  if(t.id==='mfX'){ cerrarForm(); }
  else if(t.id==='mfOtro'){ leerForm(); MF.p=null; repintarForm(); setTimeout(()=>$('mfProd')&&$('mfProd').focus(),30); }
  else if(t.dataset.mfu){ leerForm(); MF.uni=t.dataset.mfu; repintarForm(); }
  else if(t.dataset.mfm){ leerForm(); MF.motivo=t.dataset.mfm; repintarForm(); }
  else if(t.dataset.mfd){ leerForm(); MF.destino=t.dataset.mfd; repintarForm(); }
  else if(t.dataset.mfp){ leerForm(); MF.p=BYID[t.dataset.mfp]; MF.uni=unidadPorDefecto(MF.p); repintarForm(); setTimeout(()=>$('mfCant')&&$('mfCant').focus(),30); }
  else if(t.id==='mfSinFoto'){ leerForm(); MF.foto=''; repintarForm(); }
  else if(t.id==='mfOk'){ guardarMerma(); }
});
document.addEventListener('input',e=>{
  if(e.target.id!=='mfProd'||!MF) return; const v=e.target.value, ex=DATA.find(p=>p.ref===v);
  if(ex){ leerForm(); MF.p=ex; MF.uni=unidadPorDefecto(ex); repintarForm(); setTimeout(()=>$('mfCant')&&$('mfCant').focus(),30); return; }
  const s=$('mfSug'); if(!s) return; if(v.trim().length<2){ s.innerHTML=''; return; }
  const frase=slug(v).replace(/-/g,' ').trim(), qw=[...new Set(palabras(v).map(fon))]; const fz={}; qw.forEach(w=>fz[w]=!conocida(w));
  const L=DATA.map(p=>[p,relevancia(p,qw,frase,fz)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
  s.innerHTML=L.length?`<div class="msug">${L.map(p=>`<button data-mfp="${p.id}"><span class="img">${TH(p)}</span>${esc(p.ref)}<small>${esc(p.fmt)}</small></button>`).join('')}</div>`:'<div class="count">No encuentro ese producto.</div>';
});
document.addEventListener('change',async e=>{
  if(e.target.id!=='mfFoto'||!MF) return; const f=e.target.files&&e.target.files[0]; if(!f) return;
  try{ leerForm(); MF.foto=await comprimir(f); repintarForm(); }catch(err){ toast('No se ha podido leer la foto.'); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&MF) cerrarForm(); });

/* acciones de la vista de merma */
async function accionMerma(t,e){
  if(t.dataset.mnew!=null){ abrirFormMerma(t.dataset.mnew||null,t.dataset.mmot||''); return true; }
  if(t.dataset.mt){ M.tSel=t.dataset.mt; document.querySelectorAll('[data-mt]').forEach(b=>b.setAttribute('aria-pressed',b===t)); return true; }
  if(t.id==='mGuardarDisp'){ const n=($('mNom').value||'').trim(), ti=M.tSel||mTienda(); if(!ti){ toast('Elige la tienda.'); return true; } if(n.length<2){ toast('Escribe tu nombre.'); return true; } LS.set('merma-tienda',ti); LS.set('merma-nombre',n); pintarMerma(); mRefrescar(true); return true; }
  if(t.id==='mCambiar'){ M.tSel=mTienda(); LS.set('merma-nombre',''); pintarMerma(); return true; }
  if(t.id==='mRetry'){ enviarCola(); mRefrescar(); return true; }
  if(t.id==='mEntrar'){ const pin=($('mPin').value||'').trim(); if(!pin) return true; t.disabled=true;
    try{ const j=await api('pin',{pin}); M.resp={pin,tiendas:j.tiendas,central:j.central}; M.rq.tienda=j.central?'Todas':j.tiendas[0]; SS.set('merma-pin',pin); SS.set('merma-alc',JSON.stringify(M.resp)); await mRefrescar(); }
    catch(err){ toast(err.code==='pin'?'PIN incorrecto.':'No hay conexión con la hoja.'); t.disabled=false; } return true; }
  if(t.id==='mSalir'){ salirResp(); pintarMerma(); return true; }
  if(t.dataset.mrg){ M.rq.rango=t.dataset.mrg; if(M.rq.rango!=='otro') await mRefrescar(); else pintarMerma(); return true; }
  if(t.id==='mAplicar'){ M.rq.desde=$('mDesde').value; M.rq.hasta=$('mHasta').value; if(M.rq.desde&&M.rq.hasta&&M.rq.desde>M.rq.hasta) [M.rq.desde,M.rq.hasta]=[M.rq.hasta,M.rq.desde]; await mRefrescar(); return true; }
  if(t.dataset.mtr){ M.rq.tienda=t.dataset.mtr; await mRefrescar(); return true; }
  if(t.dataset.mes!=null){ M.rq.estado=t.dataset.mes; pintarMerma(); return true; }
  if(t.dataset.mfoto){ const id=t.dataset.mfoto; t.textContent='Cargando…'; try{ const j=await api('foto',{pin:M.resp.pin,id}); M.fotos[id]=j.foto; }catch(err){ toast('No se ha podido cargar la foto.'); } pintarMerma(); return true; }
  if(t.dataset.mrev){ const id=t.dataset.id, nota=($('mn-'+id)||{}).value||''; t.disabled=true;
    try{ await api('review',{pin:M.resp.pin,id,estado:t.dataset.mrev,nota}); const r=M.regs.find(x=>x.id===id); if(r){ r.estado=t.dataset.mrev; if(nota) r.nota_revision=nota; } M.abierto=null; toast(t.dataset.mrev==='Validado'?'Validado.':t.dataset.mrev==='Rechazado'?'Rechazado.':'Vuelve a pendiente.'); pintarMerma(); mRefrescar(true); }
    catch(err){ toast('No se ha podido guardar. Revisa la conexión.'); t.disabled=false; } return true; }
  if(t.id==='mCsv'){ exportarCSV(); return true; }
  return false;
}
function exportarCSV(){
  const q=M.rq, L=M.regs.filter(r=>(!q.motivo||r.motivo===q.motivo)&&(!q.estado||(r.estado||'Pendiente')===q.estado));
  const cols=['fecha','fecha_hora','tienda','empleado','producto','categoria','subcategoria','formato','cantidad','unidad','motivo','destino','comentario','estado','revisado_por','revisado_el','nota_revision'];
  const c=v=>{ v=String(v==null?'':v); if(typeof v==='string'&&/^\d+\.\d+$/.test(v)) v=v.replace('.',','); return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const csv='﻿'+cols.join(';')+'\n'+L.map(r=>cols.map(k=>c(r[k])).join(';')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); const rg=rangoFechas();
  a.download=`merma_${q.tienda==='Todas'?'todas':slug(q.tienda)}_${rg[0]}_${rg[1]}.csv`; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}
(function(){ try{ const pin=SS.get('merma-pin'), al=SS.get('merma-alc'); if(pin&&al){ M.resp=JSON.parse(al); M.resp.pin=pin; M.rq.tienda=M.resp.central?'Todas':M.resp.tiendas[0]; } }catch(e){} })();
addEventListener('online',()=>enviarCola());
setInterval(()=>{ if(document.hidden) return; if(mCola().length) enviarCola(); else if(VIEW==='merma') mRefrescar(true); },20000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&VIEW==='merma') mRefrescar(true); });
mConfig().then(()=>{ if(mCola().length) enviarCola(); });

/* ---- router ---- */
let VIEW='inicio';
function render(){
  const h=location.hash.replace('#','')||'inicio';
  const isP=h.startsWith('p-'); VIEW=isP?'ficha':(['inicio','catalogo','calendario','camara','merma','revision'].includes(h)?h:'inicio');
  if(!isP) S.back='#'+VIEW;
  document.querySelectorAll('.nav a').forEach(a=>a.setAttribute('aria-current',a.dataset.v===(isP?(S.back||'#catalogo').slice(1):VIEW)?'page':'false'));
  $('mName').textContent=MESES[S.mes];
  const html=isP?vFicha(h.slice(2)):({inicio:vInicio,catalogo:vCatalogo,calendario:vCalendario,camara:vCamara,merma:vMerma,revision:vRevision}[VIEW])();
  $('main').innerHTML=`<div class="page">${html}</div>`;
}
function go(hash){ if(location.hash===hash) render(); else location.hash=hash; }
addEventListener('hashchange',()=>{ render(); scrollTo(0,0); });

const MKEYS=['mnew','mt','mrg','mtr','mes','mfoto','mrev'], MIDS=['mGuardarDisp','mCambiar','mRetry','mEntrar','mSalir','mAplicar','mCsv'];
$('main').addEventListener('click',e=>{
  const t=e.target.closest('button,a');
  if(!t){ const r=e.target.closest('[data-mr]'); if(r&&!e.target.closest('.mdet')){ M.abierto=M.abierto===r.dataset.mr?null:r.dataset.mr; pintarMerma(); } return; }
  if(MKEYS.some(k=>t.dataset[k]!=null)||MIDS.includes(t.id)){ e.preventDefault(); accionMerma(t,e); return; }
  if(t.dataset.go){ S.est=t.dataset.go==='finde'?'finde':t.dataset.go; S.cat='Todas'; S.sub='Todas'; S.q=''; S.uso='todos'; $('q').value=$('q2').value=''; go('#catalogo'); }
  else if(t.dataset.href){ go(t.dataset.href); }
  else if(t.dataset.cat){ S.cat=t.dataset.cat; S.sub='Todas'; S.est='todos'; LS.set('cat',S.cat); go('#catalogo'); }
  else if(t.dataset.c!=null){ S.cat=t.dataset.c; S.sub='Todas'; LS.set('cat',S.cat); render(); }
  else if(t.dataset.s!=null){ S.sub=t.dataset.s; render(); }
  else if(t.dataset.e!=null){ S.est=t.dataset.e; render(); }
  else if(t.dataset.u!=null){ S.uso=t.dataset.u; render(); }
  else if(t.dataset.uso){ S.uso=t.dataset.uso; S.est='tienda'; S.cat='Todas'; S.sub='Todas'; S.q=''; $('q').value=$('q2').value=''; go('#catalogo'); }
  else if(t.dataset.fam){ S.q=t.dataset.fam; S.cat='Todas'; S.sub='Todas'; S.est='todos'; S.uso='todos'; $('q').value=$('q2').value=S.q; go('#catalogo'); }
  else if(t.dataset.vista){ S.vista=t.dataset.vista; LS.set('vista',S.vista); render(); }
  else if(t.dataset.cc){ S.calCat=t.dataset.cc; LS.set('calCat',S.calCat); render(); }
  else if(t.dataset.rc){ S.revCat=t.dataset.rc; render(); }
  else if(t.dataset.rv){ const id=t.dataset.rv; REV[id]=!REV[id]; if(!REV[id]) delete REV[id]; LS.set('rev-'+hoyKey(),REV); const y=scrollY; render(); scrollTo(0,y); }
  else if(t.id==='rSolo'){ S.revSolo=!S.revSolo; render(); }
  else if(t.id==='rReset'){ REV={}; LS.set('rev-'+hoyKey(),REV); render(); }
  else if(t.dataset.a){ e.preventDefault(); const el=$(t.dataset.a); if(el) el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}); }
});
$('main').addEventListener('change',e=>{ if(e.target.id==='fOrd'){ S.orden=e.target.value; render(); } if(e.target.id==='mMotivo'){ M.rq.motivo=e.target.value; pintarMerma(); } });
$('main').addEventListener('input',e=>{ if(e.target.id==='ca'||e.target.id==='cb'){ S[e.target.id]=e.target.value; clearTimeout(window._ct); window._ct=setTimeout(()=>{ const v=$('verd'); if(v) v.innerHTML=verdHTML(); },250); } });
$('mPrev').onclick=()=>{ S.mes=mm(S.mes-1); render(); };
$('mNext').onclick=()=>{ S.mes=mm(S.mes+1); render(); };
let tq; const onQ=e=>{ clearTimeout(tq); const v=e.target.value; $('q').value=$('q2').value=v; tq=setTimeout(()=>{ S.q=v; if(v){ S.cat='Todas'; S.sub='Todas'; S.est='todos'; } if(VIEW!=='catalogo'||location.hash!=='#catalogo') go('#catalogo'); else { render(); } const inp=e.target; requestAnimationFrame(()=>inp.focus()); },160); };
$('q').addEventListener('input',onQ); $('q2').addEventListener('input',onQ);

fetch('campo.json').then(r=>r.json()).then(d=>{
  DATA=d.map(p=>Object.assign(p,{_s:slug([p.ref,p.cat,p.sub,p.lat,p.fmt,p.sabor,p.aroma,p.textura,p.usos.join(' '),p.pepita||''].join(' ')).replace(/-/g,' '),_s0:slug(p.ref).replace(/-/g,' '),_ref:[...new Set(palabras(p.ref).map(fon))],_m:[...new Set(palabras([p.fmt,p.cat,p.sub,p.lat].join(' ')).map(fon))],_r:[...new Set(palabras([p.sabor,p.aroma,p.textura,p.usos.join(' '),p.pepita||''].join(' ')).filter(w=>w.length>=3).map(fon))]})); VOC=[...new Set(DATA.flatMap(p=>[...p._ref,...p._m,...p._r]))];
  DATA.forEach(p=>BYID[p.id]=p);
  if(!['Todas',...new Set(DATA.map(p=>p.cat))].includes(S.cat)) S.cat='Todas';
  render();
}).catch(()=>{ $('main').innerHTML='<div class="page"><div class="empty">No se han podido cargar los datos. Recarga la página.</div></div>'; });
</script>
